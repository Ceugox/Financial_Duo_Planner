# O portao do repo, em push na main e em pull request. Um job por toolchain:
# rodam em paralelo e a quebra de um nao esconde o resultado do outro.
#
# As versoes sao as que o `nixpacks.toml` declara para producao, python310 e
# nodejs_20. Se elas mudarem la, mudam aqui, e a divergencia quebra no CI e
# nao no deploy.
#
# O backend roda a suite pytest (backend/tests) sobre SQLite em memoria:
# compileall continua antes dela porque pega erro de sintaxe mais rapido.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: '3.10'
      - run: uv venv .venv && uv pip install -r backend/requirements.txt
      - run: .venv/bin/python -m compileall -q backend/app
      - run: .venv/bin/python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
