# O portao do repo, em push na main e em pull request. Um job por toolchain:
# rodam em paralelo e a quebra de um nao esconde o resultado do outro.
#
# As versoes sao as que o `nixpacks.toml` declara para producao, python310 e
# nodejs_20. Se elas mudarem la, mudam aqui, e a divergencia quebra no CI e
# nao no deploy.
#
# O backend ainda nao tem suite de teste: o portao dele hoje instala as
# dependencias e compila todo o codigo, o que pega erro de sintaxe e
# dependencia quebrada, e nao pega erro de comportamento. Quando existir
# suite, ela entra aqui no lugar do compileall.
#
# O `npm run lint` esta fora do portao de proposito: em 14/09/2026 ele falha
# com 5 erros de `no-explicit-any` que ja estavam no repo. Portao que nasce
# vermelho vira ruido e ninguem olha. Quem corrigir os 5 acrescenta a linha
# `- run: npm run lint` antes do build. O `npm run build` roda `tsc -b`, entao
# erro de tipo ja quebra aqui.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: '3.10'
      - run: uv venv .venv && uv pip install -r backend/requirements.txt
      - run: .venv/bin/python -m compileall -q backend/app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
